<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1419">
  <title>麻雀トラッカー</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="麻雀">
  <script>
    // GitHub Pages は index.html を10分キャッシュするため、?v= を書き換えるだけでは
    // 古いHTMLが古いJS/CSSを読み続けてしまう。読み込み時刻を付けて常に最新を取得する。
    window.__MJ_T = Date.now();
    (function () {
      var l = document.createElement('link');
      l.rel = 'stylesheet';
      l.href = 'css/style.css?t=' + window.__MJ_T;
      document.head.appendChild(l);
    })();
  </script>
</head>
<body>
  <header>
    <div class="container header-bar">
      <h1>🀄 麻雀トラッカー</h1>
      <div id="header-right"></div>
    </div>
  </header>

  <main class="container">
    <div id="app"><div class="loading">読み込み中…</div></div>
  </main>

  <nav class="nav">
    <a href="#home">🏠<br>ホーム</a>
    <a href="#calendar">📅<br>カレンダー</a>
    <a href="#board">💬<br>掲示板</a>
    <a href="#rankings">🏆<br>順位</a>
    <a href="#settings">⚙️<br>設定</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // async=false で挿入順どおりに実行される（config → auth → app の順が必要）
    (function () {
      var t = window.__MJ_T || Date.now();
      ['js/config.js', 'js/auth.js', 'js/app.js'].forEach(function (src) {
        var el = document.createElement('script');
        el.src = src + '?t=' + t;
        el.async = false;
        document.head.appendChild(el);
      });
    })();
  </script>
</body>
</html>
